name: Build PressFran Efficient APK

on:
  push:
    branches: [pressfran-efficient-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore PressFran v2.1
        run: |
          cat v21/pf.part00 v21/pf.part01 v21/pf.part02 v21/pf.part03 v21/pf.part04 v21/pf.part05 | tr -d '\r\n ' > v21/project.b64
          base64 -d -i v21/project.b64 > v21/project.zip
          unzip -t v21/project.zip
          unzip -q v21/project.zip

      - name: Build APK
        working-directory: PressFran_Cobranzas_Android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp PressFran_Cobranzas_Android/app/build/outputs/apk/debug/app-debug.apk PressFran-Cobranzas-v2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PressFran-Cobranzas-v2.1
          path: PressFran-Cobranzas-v2.1.apk
          if-no-files-found: error
          retention-days: 30
