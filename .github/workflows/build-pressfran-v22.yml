name: Build PressFran v2.4 Clientes Detalle APK

on:
  push:
    branches: [pressfran-v24-clientes-detalle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact PressFran v2.1 project
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('v21/pf.part00')
          s=p.read_text().strip()
          target='535f8ccb2eaac487f07a123a3e428ea5fd651242'
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          def git_hash(x):
              b=x.encode()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if git_hash(s)!=target:
              found=None
              for i in range(len(s)+1):
                  for ch in alphabet:
                      candidate=s[:i]+ch+s[i:]
                      if git_hash(candidate)==target:
                          found=candidate
                          break
                  if found: break
              if not found: raise SystemExit('Could not reconstruct exact part00')
              s=found
          parts=[s]
          for i in range(1,6): parts.append(Path(f'v21/pf.part{i:02d}').read_text().strip())
          Path('v21/project.b64').write_text(''.join(parts))
          PY
          base64 -d v21/project.b64 > v21/project.zip
          unzip -q v21/project.zip

      - name: Apply stable v2.2 SMS base
        run: |
          cp -a v22files/app/. PressFran_Cobranzas_Android/app/
          gzip -dc v22files-gz/DbHelper.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/DbHelper.java
          gzip -dc v22files-gz/MainActivity.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/MainActivity.java
          gzip -dc v22files-gz/MessageBuilder.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/MessageBuilder.java

      - name: Apply v2.3 financial and branding source files
        run: |
          cp v23files/app-build.gradle PressFran_Cobranzas_Android/app/build.gradle
          gzip -dc v23files-gz/DbHelper.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/DbHelper.java
          gzip -dc v23files-gz/MainActivity.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/MainActivity.java
          gzip -dc v23files-gz/MessageBuilder.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/MessageBuilder.java
          gzip -dc v23files-gz/ReminderReceiver.java.gz > PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/ReminderReceiver.java
          cp v23files/FinanceSummary.java PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/FinanceSummary.java

      - name: Apply v2.4 client and loan-detail patch
        run: |
          patch -p0 < v24.patch
          grep -q 'applicationId "com.pressfran.cobranzas.finance.v24"' PressFran_Cobranzas_Android/app/build.gradle
          grep -q 'versionName "2.4-clientes-detalle"' PressFran_Cobranzas_Android/app/build.gradle
          grep -q 'Agregar cliente' PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/MainActivity.java
          grep -q 'Interés total pactado' PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/MainActivity.java
          grep -q 'customerHasHistory' PressFran_Cobranzas_Android/app/src/main/java/com/pressfran/cobranzas/DbHelper.java

      - name: Build APK
        working-directory: PressFran_Cobranzas_Android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp PressFran_Cobranzas_Android/app/build/outputs/apk/debug/app-debug.apk PressFran-Cobranzas-v2.4-Clientes-Detalle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PressFran-Cobranzas-v2.4-Clientes-Detalle
          path: PressFran-Cobranzas-v2.4-Clientes-Detalle.apk
          if-no-files-found: error
          retention-days: 30
