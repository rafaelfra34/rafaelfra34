name: Build PressFran APK

on:
  push:
    branches: [pressfran-cobranzas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore PressFran project
        run: |
          cat pressfran_parts/part*.b64 > pressfran_project.complete.b64
          base64 -d pressfran_project.complete.b64 > pressfran.zip
          unzip -q pressfran.zip
          test -f PressFran_Cobranzas_Android/settings.gradle

      - name: Build debug APK
        working-directory: PressFran_Cobranzas_Android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp PressFran_Cobranzas_Android/app/build/outputs/apk/debug/app-debug.apk PressFran-Cobranzas-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PressFran-Cobranzas-v1
          path: PressFran-Cobranzas-v1.apk
          if-no-files-found: error
          retention-days: 30
