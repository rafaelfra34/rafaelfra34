plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pressfran.cobranzas'
    compileSdk 35

    defaultConfig {
        applicationId "com.pressfran.cobranzas.finance"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "2.3-financiera"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
